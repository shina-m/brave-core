# Builds and publishes a signed Brave for Android APK from this fork.
#
# GitHub's 4-core public-repository runner currently has a 145 GB disk with
# about 88 GB free (the docs only guarantee 14 GB). That is enough for a
# trimmed build, so the workflow frees optional toolchains, syncs without git
# history, and disables symbols/LTO to stay inside it.
#
# A self-hosted runner with more disk can still be selected with
# `runner_labels`; the trimming is harmless there too.
name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options:
          - Release
          - Debug
        default: Release
      target_arch:
        description: Target CPU architecture
        type: choice
        options:
          - arm64
          - arm
          - x64
        default: arm64
      runner_labels:
        description: JSON array of runner labels
        type: string
        default: '["ubuntu-latest"]'
      publish:
        description: Create a GitHub release with the APK
        type: boolean
        default: true

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.build_type || 'Release' }} (${{ inputs.target_arch || 'arm64' }})
    runs-on: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
    timeout-minutes: 350

    steps:
      - name: Check free disk
        run: |
          available_gb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print int($4 / 1024 / 1024)}')
          echo "Free disk: ${available_gb} GB"
          if [ "$available_gb" -lt 50 ]; then
            echo "::error::Chromium for Android needs at least 50 GB after cleanup, found ${available_gb} GB."
            exit 1
          fi

      - name: Set up depot_tools
        run: |
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Check out this fork into src/brave
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: src/brave
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/local/.ghcup /usr/share/dotnet /usr/share/swift \
            /usr/local/julia* /usr/local/share/miniconda /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Go /opt/hostedtoolcache/PyPy 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Sync Chromium and apply Brave patches
        working-directory: src/brave
        run: |
          pnpm run init --no-history \
            --target_os=android \
            --target_arch=${{ inputs.target_arch || 'arm64' }}
          df -h /

      - name: Install Chromium build dependencies
        working-directory: src/brave
        run: |
          if [ ! -x ../build/install-build-deps.sh ]; then
            echo "::warning::install-build-deps.sh not found; assuming the runner is preconfigured."
            exit 0
          fi
          # The hosted image already carries most of these; the script is
          # idempotent. Ubuntu 26.04 may need --unsupported.
          sudo ../build/install-build-deps.sh --android --no-prompt \
            || sudo ../build/install-build-deps.sh --unsupported --android --no-prompt \
            || echo "::warning::install-build-deps.sh failed; continuing with the image's packages."

      - name: Configure BravePipe signing
        working-directory: src/brave
        env:
          KEYSTORE_BASE64: ${{ secrets.BRAVEPIPE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BRAVEPIPE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BRAVEPIPE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BRAVEPIPE_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/bravepipe-fork.keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] \
              || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::BravePipe signing secrets are missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          node -e '
          const fs = require("node:fs");
          const values = {
            brave_android_keystore_path: process.env.KEYSTORE_PATH,
            brave_android_keystore_name: process.env.KEY_ALIAS,
            brave_android_keystore_password: process.env.KEYSTORE_PASSWORD,
            brave_android_key_password: process.env.KEY_PASSWORD,
          };
          for (const [key, value] of Object.entries(values)) {
            if (!value) {
              console.error(key + " is empty");
              process.exit(1);
            }
          }
          const lines = Object.entries(values).map(
            ([key, value]) => key + "=" + JSON.stringify(value));
          fs.writeFileSync(".env", lines.join("\n") + "\n");
          '

      - name: Build APK
        working-directory: src/brave
        env:
          JAVA_OPTS: -Xmx6G -Xms512M
        run: |
          df -h /
          pnpm run build ${{ inputs.build_type || 'Release' }} \
            --target_os=android \
            --target_arch=${{ inputs.target_arch || 'arm64' }} \
            --target_android_output_format=apk \
            --gn=is_official_build:false \
            --gn=use_dummy_lastchange:false \
            --gn=is_java_debug:true \
            --gn=is_debug:false \
            --gn=is_component_build:false \
            --gn=symbol_level:0 \
            --gn=blink_symbol_level:0 \
            --gn=use_thin_lto:false \
            --gn=dcheck_always_on:false \
            --gn=exclude_unwind_tables:true \
            --gn=enable_proguard_obfuscation:false
          df -h /

      - name: Ensure the APK is signed with the BravePipe key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BRAVEPIPE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BRAVEPIPE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BRAVEPIPE_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/bravepipe-fork.keystore
        run: |
          set -euo pipefail
          APK=$(find "src/out/android_${{ inputs.build_type || 'Release' }}_${{ inputs.target_arch || 'arm64' }}" \
            -path '*/apks/Brave*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "APK: $APK"

          BUILD_TOOLS=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"/* | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          expected=$(keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          actual=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}' \
            | tr -d ':' | tr 'A-F' 'a-f')

          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "Re-signing APK with the BravePipe key"
            rm -rf "$RUNNER_TEMP/apk-sign"
            mkdir -p "$RUNNER_TEMP/apk-sign"
            cp "$APK" "$RUNNER_TEMP/apk-sign/unsigned.apk"
            zip -q -d "$RUNNER_TEMP/apk-sign/unsigned.apk" \
              'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' || true
            "$ZIPALIGN" -p -f 4 "$RUNNER_TEMP/apk-sign/unsigned.apk" \
              "$RUNNER_TEMP/apk-sign/aligned.apk"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --in "$RUNNER_TEMP/apk-sign/aligned.apk" \
              --out "$APK"
          else
            echo "APK already signed with the BravePipe key"
          fi

          "$APKSIGNER" verify --print-certs "$APK"
          echo "SIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brave-android-${{ inputs.build_type || 'Release' }}-${{ inputs.target_arch || 'arm64' }}
          path: src/out/android_${{ inputs.build_type || 'Release' }}_${{ inputs.target_arch || 'arm64' }}/apks/Brave*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: ${{ inputs.publish || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src/brave/package.json').version")
          tag="android-v${version}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          apk="$SIGNED_APK"
          asset="Brave-Android-${version}-${{ inputs.target_arch || 'arm64' }}.apk"
          cp "$apk" "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && sha256sum "$asset" > "$asset.sha256")

          gh release create "$tag" \
            "$RUNNER_TEMP/$asset" \
            "$RUNNER_TEMP/$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Brave Android ${version} (${GITHUB_RUN_NUMBER})" \
            --notes "Brave for Android built from \`${GITHUB_SHA}\` with the YouTube media-key seek change.

          - Arch: \`${{ inputs.target_arch || 'arm64' }}\`
          - Build type: \`${{ inputs.build_type || 'Release' }}\`
          - Signed with the BravePipe fork key

          Settings: **Settings → Media → YouTube → Seek with media keys** (default on), with a 5/10/15/30/60 second seek step." \
            --latest

      - name: Summary
        run: |
          {
            echo "### Brave for Android"
            echo ""
            echo "- APK: \`$SIGNED_APK\`"
            echo "- Signed with the BravePipe fork key"
            if [ "${{ inputs.publish || github.event_name == 'push' }}" = "true" ]; then
              echo "- Release tag: \`android-v$(node -p "require('./src/brave/package.json').version")-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
