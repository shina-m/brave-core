# Builds a Brave for Android APK from this fork.
#
# Chromium for Android needs roughly 150 GB of free disk (checkout + build
# output) and 16 GB+ of RAM. GitHub-hosted runners only provide about 14 GB,
# so this job defaults to a self-hosted runner. Point `runner_labels` at a
# larger runner (or a self-hosted machine) that already has the
# prerequisites from the Android Development Environment wiki page.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options:
          - Release
          - Debug
        default: Release
      target_arch:
        description: Target CPU architecture
        type: choice
        options:
          - arm64
          - arm
          - x64
        default: arm64
      runner_labels:
        description: JSON array of runner labels (needs >= 150 GB free disk)
        type: string
        default: '["self-hosted","linux","x64","brave-android"]'
  push:
    branches:
      - youtube-media-seek
    paths:
      - .github/workflows/android-build.yml
      - browser/android/youtube_script_injector/**
      - android/java/org/chromium/chrome/browser/settings/MediaPreferences.java
      - android/java/brave-res/xml/media_preferences.xml
      - components/constants/pref_names.h
      - browser/brave_profile_prefs.cc

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.build_type || 'Release' }} (${{ inputs.target_arch || 'arm64' }})
    runs-on: ${{ fromJSON(inputs.runner_labels || '["self-hosted","linux","x64","brave-android"]') }}
    timeout-minutes: 480

    steps:
      - name: Check free disk
        run: |
          available_gb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print int($4 / 1024 / 1024)}')
          echo "Free disk: ${available_gb} GB"
          if [ "$available_gb" -lt 150 ]; then
            echo "::error::Chromium for Android needs at least 150 GB free, found ${available_gb} GB. Use a self-hosted or larger runner."
            exit 1
          fi

      - name: Set up depot_tools
        run: |
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Check out this fork into src/brave
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: src/brave
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Sync Chromium and apply Brave patches
        working-directory: src/brave
        run: pnpm run init --target_os=android --target_arch=${{ inputs.target_arch || 'arm64' }}

      - name: Build APK
        working-directory: src/brave
        env:
          JAVA_OPTS: -Xmx10G -Xms1G
        run: |
          pnpm run build ${{ inputs.build_type || 'Release' }} \
            --target_os=android \
            --target_arch=${{ inputs.target_arch || 'arm64' }} \
            --target_android_output_format=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brave-android-${{ inputs.build_type || 'Release' }}-${{ inputs.target_arch || 'arm64' }}
          path: src/out/android_*/apks/*.apk
          if-no-files-found: error
          retention-days: 14
